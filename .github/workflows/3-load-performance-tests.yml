name: 3 - Load & Performance Tests

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  load-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install autocannon and xlsx for load testing
        run: npm install --no-save autocannon xlsx wait-on

      - name: Start dev server in background
        continue-on-error: true
        run: |
          npm run dev &
          echo "Waiting for server..."
          npx wait-on http://localhost:5173 --timeout 60000 || echo "Server may not be ready, continuing..."
        env:
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder
          VITE_FIREBASE_PROJECT_ID: placeholder
          VITE_FIREBASE_STORAGE_BUCKET: placeholder
          VITE_FIREBASE_MESSAGING_SENDER_ID: placeholder
          VITE_FIREBASE_APP_ID: placeholder

      - name: Run Load & Performance Tests (336 scenarios)
        run: node tests/performance/load-test.js
        continue-on-error: true

      - name: Ensure reports directory exists
        run: mkdir -p reports

      - name: List generated reports
        run: ls -lh reports/ || echo "No reports found"

      - name: Upload Load Test Excel Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Load-Performance-Test-Report-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
