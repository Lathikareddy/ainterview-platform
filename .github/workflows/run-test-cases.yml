name: Complete E2E and Test Case Automation

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  run-all-test-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome for Headless Testing
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Start Application Development Server
        run: |
          npm run dev &
          echo "Waiting for development server to respond..."
          npx wait-on http://localhost:5173/ainterview-platform/ --timeout 60000

      - name: Run Web Selenium E2E Tests (300+ Test Cases)
        run: |
          node selenium-tests/tests/login-tests.js
          node tests/web/selenium-test.js
        continue-on-error: true
        env:
          DISPLAY: ':99'

      - name: Run Appium Mobile Model Tests (300+ Test Cases)
        run: |
          node appium-tests/tests/login-tests.js
          node tests/mobile/appium-test.js
        continue-on-error: true

      - name: Run Vulnerability Assessments
        run: node tests/security/vulnerability-test.js
        continue-on-error: true
        env:
          DISPLAY: ':99'

      - name: Run Load Testing
        run: node tests/performance/load-test.js
        continue-on-error: true

      - name: Compile Master Test Report
        run: node tests/report/master-report.js
        if: always()

      - name: Upload Test Report Excel Spreadsheets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Excel-Test-Reports-${{ github.run_number }}-${{ github.sha }}
          path: |
            reports/
            tests/reports/
          retention-days: 30
          if-no-files-found: warn
