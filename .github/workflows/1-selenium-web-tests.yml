name: 1 - Selenium Web E2E Tests

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  selenium-web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Selenium test dependencies
        run: npm install --no-save selenium-webdriver xlsx wait-on

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Start dev server in background
        run: |
          npm run dev &
          echo "Dev server started, waiting..."
          npx wait-on http://localhost:5173 --timeout 30000 || true
        env:
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder
          VITE_FIREBASE_PROJECT_ID: placeholder

      - name: Run Selenium E2E Tests (300+ test cases)
        run: node selenium-tests/tests/login-tests.js
        continue-on-error: true
        env:
          DISPLAY: ':99'

      - name: Run original Selenium test suite
        run: node tests/web/selenium-test.js
        continue-on-error: true
        env:
          DISPLAY: ':99'

      - name: Verify Excel report was generated
        run: |
          mkdir -p reports
          ls -lh reports/ || echo "No reports yet"

      - name: Upload Selenium Excel Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Selenium-Web-E2E-Report-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
