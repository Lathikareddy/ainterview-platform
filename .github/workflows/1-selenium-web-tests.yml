name: 1 - Selenium Web E2E Tests

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  selenium-web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Selenium test dependencies
        run: npm install --no-save selenium-webdriver xlsx wait-on

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Start dev server in background
        continue-on-error: true
        run: |
          npm run dev &
          echo "Dev server started, waiting for http://localhost:5173..."
          npx wait-on http://localhost:5173 --timeout 60000 || echo "Server may not be ready, continuing..."
        env:
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: placeholder
          VITE_FIREBASE_STORAGE_BUCKET: placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: 1:000000000000:web:placeholder
          VITE_GOOGLE_CLIENT_ID: placeholder.apps.googleusercontent.com

      - name: Verify server is running
        run: curl -s --max-time 10 http://localhost:5173 | head -5 || echo "Server check done"

      - name: Run Selenium E2E Tests (300+ test cases)
        run: node selenium-tests/tests/login-tests.js
        continue-on-error: true

      - name: Run original Selenium test suite
        run: node tests/web/selenium-test.js
        continue-on-error: true

      - name: Ensure reports directory exists
        run: mkdir -p reports

      - name: List generated reports
        run: ls -lh reports/ || echo "No reports found"

      - name: Upload Selenium Excel Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Selenium-Web-E2E-Report-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
