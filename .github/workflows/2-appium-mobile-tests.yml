name: 2 - Appium Mobile Tests

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  appium-mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install xlsx for report generation
        run: npm install --no-save xlsx

      - name: Generate Appium Mobile Test Report (308+ test cases)
        run: node appium-tests/tests/login-tests.js

      - name: Generate Appium legacy report
        run: node tests/mobile/appium-test.js

      - name: List generated reports
        run: ls -lh reports/

      - name: Upload Appium Mobile Excel Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appium-Mobile-E2E-Report-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
